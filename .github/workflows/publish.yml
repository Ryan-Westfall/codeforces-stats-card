name: Publish to npm

# Publishes the package to npm whenever a GitHub Release is published.
# Create a release (e.g. tag v1.8.0) to trigger it, or run it manually.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted Publishing (OIDC) requires npm >= 11.5.1
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      # No token needed: authenticated via OIDC trusted publishing.
      # Provenance is attached automatically.
      - name: Publish
        run: npm publish --access public
